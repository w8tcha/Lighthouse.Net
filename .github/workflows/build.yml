name: build dotnet
on:
  push:
    branches:
      - master

jobs:
  build:

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # needed to publish the coverage badge to the "badges" branch
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        node-version: [latest]

    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      - name: Build
        run: dotnet build LighthousePlaywright.Net.slnx
      - run: npm install -g lighthouse playwright playwright-lighthouse
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Test
        run: dotnet test LighthousePlaywright.Net.slnx --collect:"XPlat Code Coverage" --results-directory TestResults
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}
          path: TestResults/**/coverage.cobertura.xml
      - name: Generate coverage report
        if: matrix.os == 'ubuntu-latest'
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator \
            "-reports:TestResults/**/coverage.cobertura.xml" \
            "-targetdir:coveragereport" \
            "-reporttypes:Badges;MarkdownSummaryGithub" \
            "-assemblyfilters:+LighthousePlaywright.Net" \
            "-classfilters:-System.Text.RegularExpressions.Generated*"
          cat coveragereport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish coverage badges
        if: matrix.os == 'ubuntu-latest' && github.ref == 'refs/heads/master'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir badges
          cp coveragereport/badge_linecoverage.svg coveragereport/badge_branchcoverage.svg badges/
          cd badges
          git init -q -b badges
          git add .
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Update coverage badges"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" badges
